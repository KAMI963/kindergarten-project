{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h2><i class="fas fa-calendar-alt text-success"></i> Выберите удобное время для визита</h2>
    
    <div class="row mt-4">
        {% for slot in available_slots %}
        <div class="col-md-3 mb-3">
            <div class="card text-center slot-card" data-datetime="{{ slot.datetime.isoformat }}">
                <div class="card-body">
                    <h5 class="card-title mb-1">{{ slot.date|date:"d.m.Y" }}</h5>
                    <p class="card-text text-muted">{{ slot.time }}</p>
                    <button class="btn btn-success btn-sm slot-btn" data-datetime="{{ slot.datetime.isoformat }}">
                        <i class="fas fa-check"></i> Выбрать
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
.slot-card {
    transition: transform 0.2s ease;
    cursor: pointer;
}
.slot-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
</style>
{% endblock %}
