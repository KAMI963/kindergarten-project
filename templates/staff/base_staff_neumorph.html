<!-- staff/templates/staff/base_staff_neumorph.html -->
{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
    /* Neumorphism & Claymorphism Styles */
    :root {
        --primary-color: #4a6fa5;
        --secondary-color: #6b8cbc;
        --success-color: #27ae60;
        --warning-color: #f39c12;
        --danger-color: #e74c3c;
        --light-bg: #e0e5ec;
        --dark-bg: #1a1f2c;
        --neumorph-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
        --neumorph-inset: inset 5px 5px 10px #bebebe, inset -5px -5px 10px #ffffff;
        --clay-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.3);
        --glass-bg: rgba(255, 255, 255, 0.25);
        --glass-border: 1px solid rgba(255, 255, 255, 0.18);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: var(--light-bg);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
    }

    /* Neumorphism Cards */
    .neo-card {
        background: var(--light-bg);
        border-radius: 50px;
        box-shadow: var(--neumorph-shadow);
        padding: 2rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .neo-card:hover {
        transform: translateY(-5px);
        box-shadow: 25px 25px 70px #bebebe, -25px -25px 70px #ffffff;
    }

    .neo-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
    }

    .neo-card:hover::before {
        left: 100%;
    }

    /* Claymorphism Cards */
    .clay-card {
        background: linear-gradient(145deg, #ffffff, #f0f0f0);
        border-radius: 30px;
        box-shadow: var(--clay-shadow);
        padding: 2rem;
        position: relative;
        overflow: hidden;
        border: var(--glass-border);
        backdrop-filter: blur(4px);
    }

    .clay-card::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 30%;
        height: 30%;
        background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.8), transparent);
        border-radius: 0 30px 0 50px;
    }

    /* Glassmorphism Cards */
    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border-radius: 30px;
        border: var(--glass-border);
        padding: 2rem;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }

    /* Parallax Sections */
    .parallax-section {
        position: relative;
        overflow: hidden;
        min-height: 100vh;
        perspective: 1px;
    }

    .parallax-layer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
    }

    .parallax-layer-base {
        transform: translateZ(0);
    }

    .parallax-layer-back {
        transform: translateZ(-1px) scale(2);
    }

    /* SPA Navigation */
    .spa-view {
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .spa-view-exit {
        animation: fadeOut 0.5s ease;
    }

    @keyframes fadeOut {
        from {
            opacity: 1;
            transform: translateY(0);
        }
        to {
            opacity: 0;
            transform: translateY(-20px);
        }
    }

    /* Neumorphism Buttons */
    .neo-btn {
        background: var(--light-bg);
        border: none;
        border-radius: 50px;
        padding: 12px 30px;
        font-size: 1rem;
        font-weight: 600;
        color: #4a4a4a;
        box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .neo-btn:hover {
        box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
        transform: scale(0.98);
    }

    .neo-btn:active {
        box-shadow: var(--neumorph-inset);
    }

    .neo-btn-primary {
        background: linear-gradient(145deg, var(--primary-color), var(--secondary-color));
        color: white;
        box-shadow: 10px 10px 20px rgba(74, 111, 165, 0.3), -10px -10px 20px rgba(107, 140, 188, 0.3);
    }

    .neo-btn-success {
        background: linear-gradient(145deg, #27ae60, #2ecc71);
        color: white;
    }

    .neo-btn-danger {
        background: linear-gradient(145deg, #e74c3c, #c0392b);
        color: white;
    }

    /* Neumorphism Inputs */
    .neo-input {
        background: var(--light-bg);
        border: none;
        border-radius: 50px;
        padding: 15px 25px;
        font-size: 1rem;
        color: #4a4a4a;
        box-shadow: inset 5px 5px 10px #bebebe, inset -5px -5px 10px #ffffff;
        transition: all 0.3s ease;
        width: 100%;
    }

    .neo-input:focus {
        outline: none;
        box-shadow: inset 8px 8px 15px #bebebe, inset -8px -8px 15px #ffffff;
    }

    /* Floating Elements */
    .floating {
        animation: floating 3s ease-in-out infinite;
    }

    @keyframes floating {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-10px);
        }
    }

    /* Gradient Text */
    .gradient-text {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* Stats Cards */
    .stat-card {
        background: linear-gradient(145deg, #ffffff, #f0f0f0);
        border-radius: 30px;
        padding: 1.5rem;
        text-align: center;
        box-shadow: 15px 15px 30px #bebebe, -15px -15px 30px #ffffff;
        transition: all 0.3s ease;
    }

    .stat-card:hover {
        transform: scale(1.05);
        box-shadow: 20px 20px 40px #bebebe, -20px -20px 40px #ffffff;
    }

    .stat-icon {
        width: 80px;
        height: 80px;
        line-height: 80px;
        border-radius: 50%;
        margin: 0 auto 1rem;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        font-size: 2rem;
        box-shadow: 10px 10px 20px rgba(74, 111, 165, 0.3);
    }

    .stat-value {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--primary-color);
        margin: 0.5rem 0;
    }

    .stat-label {
        color: #666;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Timeline */
    .neo-timeline {
        position: relative;
        padding: 2rem 0;
    }

    .neo-timeline::before {
        content: '';
        position: absolute;
        left: 1.5rem;
        top: 0;
        height: 100%;
        width: 4px;
        background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
        border-radius: 2px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }

    .timeline-item {
        position: relative;
        padding-left: 4rem;
        margin-bottom: 2rem;
        animation: slideInLeft 0.5s ease;
    }

    @keyframes slideInLeft {
        from {
            opacity: 0;
            transform: translateX(-50px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .timeline-item::before {
        content: '';
        position: absolute;
        left: 1.2rem;
        top: 1.2rem;
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        box-shadow: 0 0 0 4px rgba(74, 111, 165, 0.2);
    }

    .timeline-date {
        font-size: 0.875rem;
        color: #666;
        margin-bottom: 0.5rem;
    }

    .timeline-content {
        background: var(--light-bg);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff;
    }

    /* Progress Bars */
    .neo-progress {
        height: 10px;
        background: var(--light-bg);
        border-radius: 10px;
        box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff;
        overflow: hidden;
        margin: 1rem 0;
    }

    .neo-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(74, 111, 165, 0.5);
        transition: width 1s ease;
        position: relative;
        overflow: hidden;
    }

    .neo-progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
        100% {
            left: 100%;
        }
    }

    /* Tables */
    .neo-table-container {
        background: var(--light-bg);
        border-radius: 30px;
        padding: 1.5rem;
        box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff;
        overflow-x: auto;
    }

    .neo-table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 20px;
        overflow: hidden;
    }

    .neo-table th {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        padding: 1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.875rem;
    }

    .neo-table td {
        padding: 1rem;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        background: rgba(255,255,255,0.5);
    }

    .neo-table tr:hover td {
        background: rgba(255,255,255,0.8);
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Avatars */
    .neo-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
        box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
    }

    .neo-avatar-lg {
        width: 80px;
        height: 80px;
        font-size: 2rem;
    }

    .neo-avatar-sm {
        width: 30px;
        height: 30px;
        font-size: 0.875rem;
    }

    .neo-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
    }

    /* Badges */
    .neo-badge {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: var(--light-bg);
        box-shadow: 3px 3px 6px #bebebe, -3px -3px 6px #ffffff;
    }

    .neo-badge-success {
        background: linear-gradient(135deg, #27ae60, #2ecc71);
        color: white;
    }

    .neo-badge-warning {
        background: linear-gradient(135deg, #f39c12, #f1c40f);
        color: white;
    }

    .neo-badge-danger {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: white;
    }

    .neo-badge-info {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
    }

    /* Grid */
    .neo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        padding: 2rem;
    }

    /* Parallax Background */
    .parallax-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 50%, rgba(74, 111, 165, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(39, 174, 96, 0.1) 0%, transparent 50%);
        pointer-events: none;
        z-index: -1;
    }

    /* Loading Animation */
    .neo-loader {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--light-bg);
        box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff;
        animation: pulse 1.5s ease-in-out infinite;
        margin: 2rem auto;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
            box-shadow: 15px 15px 30px #bebebe, -15px -15px 30px #ffffff;
        }
    }

    /* SPA Page Transition */
    .spa-page {
        position: relative;
        min-height: 100vh;
        opacity: 1;
        transition: opacity 0.3s ease;
    }

    .spa-page.fade-out {
        opacity: 0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
        width: 10px;
    }

    ::-webkit-scrollbar-track {
        background: var(--light-bg);
        box-shadow: inset 3px 3px 6px #bebebe;
    }

    ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        border-radius: 10px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }
</style>
{% endblock %}

{% block content %}
<div class="parallax-bg"></div>
<div class="spa-page" id="spa-page">
    {% block staff_content %}{% endblock %}
</div>

<script>
// SPA-like navigation
document.addEventListener('DOMContentLoaded', function() {
    const page = document.getElementById('spa-page');
    
    // Handle all internal links
    document.querySelectorAll('a[href^="/staff/"]').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const href = this.getAttribute('href');
            
            // Add fade out animation
            page.classList.add('fade-out');
            
            // Navigate after animation
            setTimeout(() => {
                window.location.href = href;
            }, 300);
        });
    });
    
    // Parallax effect
    window.addEventListener('scroll', function() {
        const scrolled = window.pageYOffset;
        const parallax = document.querySelector('.parallax-bg');
        if (parallax) {
            parallax.style.transform = `translateY(${scrolled * 0.5}px)`;
        }
    });
    
    // Floating animation for cards
    const cards = document.querySelectorAll('.stat-card, .neo-card');
    cards.forEach((card, index) => {
        card.style.animation = `floating ${3 + index * 0.5}s ease-in-out infinite`;
    });
});
</script>
{% endblock %}
