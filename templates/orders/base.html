{% extends 'base.html' %}

{% block title %}{% block orders_title %}{% endblock %} - Детский сад "Рябинушка"{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title mb-0">
                        {% block card_title %}{% endblock %}
                    </h2>
                </div>
                <div class="card-body">
                    {% block orders_content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
