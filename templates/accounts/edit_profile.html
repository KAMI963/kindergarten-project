{% extends 'base.html' %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4>Редактирование профиля</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Имя</label>
                            <input type="text" name="first_name" class="form-control" value="{{ first_name }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Фамилия</label>
                            <input type="text" name="last_name" class="form-control" value="{{ last_name }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ email }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Телефон</label>
                            <input type="tel" name="phone" class="form-control" value="{{ phone }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Дата рождения</label>
                            <input type="date" name="birth_date" class="form-control" value="{{ birth_date }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Адрес</label>
                            <textarea name="address" class="form-control" rows="3">{{ address }}</textarea>
                        </div>
                        
                        {% if education %}
                        <hr>
                        <div class="mb-3">
                            <label class="form-label">Образование</label>
                            <textarea name="education" class="form-control" rows="2">{{ education }}</textarea>
                        </div>
                        {% endif %}
                        
                        {% if specialization %}
                        <div class="mb-3">
                            <label class="form-label">Специализация</label>
                            <input type="text" name="specialization" class="form-control" value="{{ specialization }}">
                        </div>
                        {% endif %}
                        
                        {% if experience is not None %}
                        <div class="mb-3">
                            <label class="form-label">Стаж (лет)</label>
                            <input type="number" name="experience" class="form-control" value="{{ experience }}">
                        </div>
                        {% endif %}
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                            <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
