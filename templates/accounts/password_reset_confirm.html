<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Новый пароль - Детский сад Рябинушка</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #4cc9f0;
            --warning: #f59e0b;
            --warning-dark: #d97706;
            --light: #f8f9fa;
            --dark: #212529;
            --gradient-primary: linear-gradient(145deg, #4361ee 0%, #3a0ca3 100%);
            --gradient-success: linear-gradient(145deg, #10b981 0%, #059669 100%);
            --border-radius: 24px;
            --border-radius-sm: 16px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        
        .password-wrapper {
            width: 100%;
            max-width: 500px;
            animation: fadeInScale 0.8s ease;
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .password-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        
        .password-header {
            background: var(--gradient-success);
            padding: 32px;
            text-align: center;
            color: white;
        }
        
        .password-header i {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .password-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .password-body {
            padding: 32px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
        }
        
        .form-label i {
            color: var(--success);
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--success);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            outline: none;
        }
        
        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: var(--gradient-success);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
            margin-bottom: 16px;
            cursor: pointer;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3);
        }
        
        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            background: transparent;
            color: var(--gray-600);
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius-sm);
            text-decoration: none;
            font-weight: 600;
        }
        
        .btn-back:hover {
            background: var(--gray-100);
        }
        
        .alert {
            padding: 16px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .alert-danger {
            background: #fff5f5;
            color: #c53030;
            border-left: 4px solid #f56565;
        }
        
        .password-hint {
            margin-top: 8px;
            font-size: 12px;
            color: var(--gray-500);
        }
        
        .password-hint i {
            margin-right: 4px;
        }
        
        .loading {
            opacity: 0.8;
            pointer-events: none;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="password-wrapper">
        <div class="password-card">
            <div class="password-header">
                <i class="fas fa-lock"></i>
                <h1 class="password-title">Новый пароль</h1>
                <p>Придумайте новый пароль для входа</p>
            </div>
            
            <div class="password-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            <i class="fas fa-info-circle"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                
                <form method="post" action="{% url 'accounts:password_reset_confirm' %}" id="passwordForm">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label class="form-label" for="id_new_password1">
                            <i class="fas fa-key"></i>
                            Новый пароль
                        </label>
                        <input 
                            type="password" 
                            name="new_password1" 
                            class="form-control" 
                            id="id_new_password1" 
                            placeholder="Введите новый пароль"
                            required
                        >
                        <div class="password-hint">
                            <i class="fas fa-info-circle"></i>
                            Пароль должен содержать минимум 8 символов
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="id_new_password2">
                            <i class="fas fa-check-circle"></i>
                            Подтверждение пароля
                        </label>
                        <input 
                            type="password" 
                            name="new_password2" 
                            class="form-control" 
                            id="id_new_password2" 
                            placeholder="Повторите новый пароль"
                            required
                        >
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-save"></i>
                        Сохранить новый пароль
                    </button>
                    
                    <a href="{% url 'accounts:login' %}" class="btn-back">
                        <i class="fas fa-arrow-left"></i>
                        Вернуться к входу
                    </a>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('passwordForm')?.addEventListener('submit', function(e) {
            const btn = document.getElementById('submitBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Сохранение...';
        });
    </script>
</body>
</html>
