<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация завершена</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .success-container {
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .success-card {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            animation: slideInUp 0.8s ease;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .checkmark-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #48c6ef 0%, #6f86d6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .checkmark {
            font-size: 60px;
            color: white;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .success-title {
            font-size: 32px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 15px;
            animation: fadeInUp 0.6s ease 0.2s both;
        }
        
        .success-message {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease 0.3s both;
        }
        
        .email-message {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeInUp 0.6s ease 0.4s both;
            border-left: 5px solid #48bb78;
        }
        
        .email-message i {
            font-size: 30px;
            color: #48bb78;
        }
        
        .email-text {
            flex: 1;
            text-align: left;
        }
        
        .email-text strong {
            color: #2d3748;
            display: block;
            margin-bottom: 5px;
        }
        
        .email-text p {
            color: #718096;
            font-size: 14px;
            margin-bottom: 0;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .redirect-message {
            color: #a0aec0;
            font-size: 15px;
            animation: fadeIn 0.6s ease 0.6s both;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            animation: confetti 3s ease-out infinite;
        }
        
        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <!-- Анимированная иконка успеха -->
            <div class="checkmark-circle">
                <i class="checkmark fas fa-check"></i>
            </div>
            
            <!-- Заголовок -->
            <h1 class="success-title">Регистрация завершена!</h1>
            
            <!-- Сообщение -->
            <p class="success-message">
                Ваш email успешно подтвержден.<br>
                Добро пожаловать в систему!
            </p>
            
            <!-- Информация о письме -->
            <div class="email-message">
                <i class="fas fa-envelope-open-text"></i>
                <div class="email-text">
                    <strong>✉️ Письмо отправлено!</strong>
                    <p>Мы отправили приветственное письмо на вашу почту</p>
                </div>
            </div>
            
            <!-- Анимация загрузки -->
            <div class="loading-spinner"></div>
            
            <!-- Сообщение о перенаправлении -->
            <p class="redirect-message">
                <i class="fas fa-arrow-right me-2"></i>
                Перенаправление на главную страницу через 3 секунды...
            </p>
        </div>
    </div>
    
    <script>
        (function() {
            // Создаем конфетти
            function createConfetti() {
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);
                    
                    // Удаляем конфетти после анимации
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }
            }
            
            // Запускаем конфетти
            createConfetti();
            
            // Перенаправление через 3 секунды
            setTimeout(function() {
                window.location.href = '{{ redirect_url }}';
            }, 3000);
        })();
    </script>
</body>
</html>
